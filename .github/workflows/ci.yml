name: CI

on:
  push:
  pull_request:

jobs:
  core-tests:
    name: ClipCore tests (Linux)
    runs-on: ubuntu-latest
    container: swift:6.1-noble
    steps:
      - uses: actions/checkout@v4
      - run: swift test
        working-directory: ClipCore

  macos-build:
    name: Build app (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen
      - name: Test ClipCore
        run: swift test
        working-directory: ClipCore
      - name: Build
        run: |
          xcodebuild build \
            -project Clippy.xcodeproj \
            -scheme Clippy \
            -configuration Debug \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO
