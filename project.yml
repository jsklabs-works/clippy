# XcodeGen spec. Run `xcodegen` to produce ClipStack.xcodeproj.
# The generated project is git-ignored; edit this file instead.
name: ClipStack
options:
  bundleIdPrefix: com.jsklabs
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    # Set your 10-character Team ID here (or in Xcode > Signing & Capabilities).
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic

packages:
  ClipCore:
    path: ClipCore
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: 2.0.0

targets:
  ClipStack:
    type: application
    platform: macOS
    scheme: {}
    sources:
      - App/Sources
      - App/Resources
    dependencies:
      - package: ClipCore
      - package: KeyboardShortcuts
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: ClipStack
        LSApplicationCategoryType: public.app-category.productivity
        # Menu-bar only: no Dock icon, no main menu.
        LSUIElement: true
        NSHumanReadableCopyright: "© 2026 JSK Labs"
        # No custom encryption: skips the export-compliance question on upload.
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: App/ClipStack.entitlements
      properties:
        # Required for the Mac App Store.
        com.apple.security.app-sandbox: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jsklabs.ClipStack
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: YES
